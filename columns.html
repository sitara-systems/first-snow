<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>First Snow — Columns (prototype)</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05070a; color: #cfd8e3; font-family: -apple-system, "Segoe UI", sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #viewWrap { flex: 1 1 auto; width: 100%; min-height: 0; position: relative; }
  #viewCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #note {
    position: absolute; top: 14px; left: 0; right: 0; text-align: center;
    font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; color: #5c6d82;
    padding: 0 20px;
  }
  #label {
    height: 2.2em; display: flex; align-items: center; justify-content: center;
    font-size: 1.0em; letter-spacing: 0.12em; text-transform: uppercase;
    color: #7f95ad; opacity: 0; transition: opacity 1.2s ease;
  }
  #label.show { opacity: 1; }
  #formingMsg {
    height: 2.2em; display: flex; align-items: center; justify-content: center;
    font-size: 0.9em; letter-spacing: 0.1em; text-transform: uppercase;
    color: #5c6d82; opacity: 0;
  }
  #formingMsg.show { animation: formingPulse 1.8s ease-in-out infinite; }
  @keyframes formingPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  #panel { width: min(70vw, 420px); display: flex; flex-direction: column; gap: 16px; margin-bottom: max(2vh, 12px); }
  .slider-row { display: flex; flex-direction: column; gap: 6px; }
  .slider-caps { display: flex; justify-content: space-between; font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; color: #5c6d82; }
  .slider-name { font-size: 0.82em; letter-spacing: 0.1em; text-transform: uppercase; color: #8fa0b5; text-align: center; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 999px; background: linear-gradient(90deg, rgba(120,170,255,0.35), rgba(255,210,150,0.35)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -8.5px; border-radius: 50%; background: #e8eef7; box-shadow: 0 0 12px 2px rgba(232,238,247,0.5); border: none; }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 999px; background: linear-gradient(90deg, rgba(120,170,255,0.35), rgba(255,210,150,0.35)); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #e8eef7; box-shadow: 0 0 12px 2px rgba(232,238,247,0.5); border: none; }
  #bottomBar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: max(2vh, 12px) 0; }
  .pillBtn { padding: 11px 26px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); color: #cfd8e3; font-size: 0.78em; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .pillBtn:active { background: rgba(255,255,255,0.18); }
  .pillBtn.primary { background: rgba(232,238,247,0.16); border-color: rgba(232,238,247,0.5); color: #f2f5fa; }
  .pillBtn:disabled { opacity: 0.35; pointer-events: none; }
  input[type=range]:disabled { opacity: 0.4; }
</style>
</head>
<body>
<div id="stage">
  <div id="viewWrap">
    <canvas id="viewCanvas"></canvas>
    <div id="note">Prototype — procedural z-axis, not a 3D physics simulation (see PLAN.md)</div>
  </div>
  <div id="label"></div>
  <div id="formingMsg">Your crystal is forming</div>
  <div id="panel">
    <div class="slider-row">
      <div class="slider-name">Aspect</div>
      <input type="range" id="sliderAspect" min="0" max="100" value="45">
      <div class="slider-caps"><span>Squat Plate</span><span>Slender Needle</span></div>
    </div>
    <div class="slider-row">
      <div class="slider-name">Facet</div>
      <input type="range" id="sliderFacet" min="0" max="100" value="50">
      <div class="slider-caps"><span>Rounder Hexagon</span><span>Sharper Hexagon</span></div>
    </div>
  </div>
  <div id="bottomBar">
    <a class="pillBtn" href="index.html">Puck</a>
    <a class="pillBtn" href="sliders.html">Sliders</a>
    <button class="pillBtn primary" id="startBtn">Grow</button>
  </div>
</div>

<script src="column-engine.js"></script>
<script type="module">
import * as THREE from './vendor/three/three.module.min.js';

// ---- Three.js scene: a minimal viewer for one extruded-hexagon mesh.
// No OrbitControls addon vendored for this prototype -- a few lines of
// manual drag-to-orbit plus a slow auto-rotate when idle covers "look at
// the 3D shape" well enough for a spike.
const canvas = document.getElementById('viewCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(2.5, 3.5, 2.5);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb0ff, 0.4);
rim.position.set(-2, -1, -2);
scene.add(rim);

let orbitAz = 0.6, orbitEl = 0.35, autoRotate = true;
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; autoRotate = false; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  orbitAz += (e.clientX - lastX) * 0.008;
  orbitEl = Math.max(-1.3, Math.min(1.3, orbitEl + (e.clientY - lastY) * 0.008));
  lastX = e.clientX; lastY = e.clientY;
});

function resize(){
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = canvas.clientHeight || canvas.parentElement.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let mesh = null;
const material = new THREE.MeshStandardMaterial({color: 0xdfeaff, metalness: 0.05, roughness: 0.25, flatShading: false});
// World-scale: radialBoundary()'s points are in lattice-pixel units
// (roughly up to ~190 at full growth); shrink to a friendlier scene scale.
const WORLD_SCALE = 1/140;

function buildMesh(points, height){
  const shape = new THREE.Shape(points.map(p => new THREE.Vector2(p[0]*WORLD_SCALE, p[1]*WORLD_SCALE)));
  // height arrives in the same lattice-pixel units as the xy points (see
  // column-engine.js's aspectRatio comment), so the same WORLD_SCALE
  // applies to both -- no separate fudge factor needed.
  const depth = Math.max(0.02, height*WORLD_SCALE);
  const geo = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled: false, curveSegments: 1});
  geo.translate(0, 0, -depth/2); // center on origin so growth reads as "expanding outward", not "growing off one face"
  geo.computeVertexNormals();
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(geo, material);
  mesh.rotation.x = -Math.PI/2; // ExtrudeGeometry extrudes along +z; stand it upright (extrusion axis -> world Y)
  scene.add(mesh);
}

function render(){
  requestAnimationFrame(render);
  if (autoRotate) orbitAz += 0.0025;
  const camR = 3.4;
  camera.position.set(
    camR*Math.cos(orbitEl)*Math.sin(orbitAz),
    camR*Math.sin(orbitEl) + 0.4,
    camR*Math.cos(orbitEl)*Math.cos(orbitAz),
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
render();

// ---- growth pipeline
const label = document.getElementById('label');
const formingMsg = document.getElementById('formingMsg');
const startBtn = document.getElementById('startBtn');
const sliderIds = ['sliderAspect','sliderFacet'];
function setLocked(locked, text){
  for (const id of sliderIds) document.getElementById(id).disabled = locked;
  startBtn.disabled = locked;
  startBtn.textContent = text || (locked ? 'Growing…' : 'Grow');
}

const PLAYBACK_MS = 12000;
let frames = null, playbackStart = 0;

async function grow(){
  label.classList.remove('show');
  setLocked(true, 'Forming…');
  formingMsg.classList.add('show');
  const aspect = document.getElementById('sliderAspect').value/100; // 0..1
  const facet = document.getElementById('sliderFacet').value/100; // 0..1
  const aspectRatio = 0.15 + aspect*3.85; // squat plate (0.15x radius tall) .. slender needle (4x radius tall), untuned -- see column-engine.js
  const beta = 1.9 + facet*0.7; // stay in the high-beta, low-branching "hexagon" band on purpose
  frames = await growColumnCrystal({beta, aspectRatio, gamma: 0.50});
  formingMsg.classList.remove('show');
  playbackStart = performance.now();
  setLocked(true, 'Growing…');
  playbackTick();
}

function playbackTick(){
  if (!frames) return;
  const elapsed = performance.now() - playbackStart;
  const t = Math.max(0, Math.min(1, elapsed/PLAYBACK_MS));
  const n = frames.length;
  const pos = t*(n-1);
  const i0 = Math.floor(pos), i1 = Math.min(n-1, i0+1);
  const frac = pos - i0;
  const h = frames[i0].height + (frames[i1].height - frames[i0].height)*frac;
  buildMesh(frames[i0].points, h);
  if (t < 1) {
    requestAnimationFrame(playbackTick);
  } else {
    setLocked(false);
    label.textContent = frames.length > 1 ? 'Column crystal' : 'Seed';
    label.classList.add('show');
    autoRotate = true;
  }
}

startBtn.addEventListener('click', grow);
grow();

// Testing hook only, mirrors engine.js's _debug -- not used by the page's
// own UI.
window.__debug = {
  grow, buildMesh, getFrames: () => frames,
  setFrames: f => { frames = f; }, // neutralizes playbackTick's rAF loop (frames=null -> no-op) for isolated testing
  renderOnce: () => renderer.render(scene, camera),
};
</script>
</body>
</html>
